<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hex-dark-title hex-dark-desc" id="hexagono-dark-root">
<title id="hex-dark-title">Arquitetura hexagonal do REMG</title>
<desc id="hex-dark-desc">O front chama o servidor HTTP em Python, que importa o núcleo Python direto, no mesmo processo. O benchmark usa a CLI. Servidor e CLI entram no núcleo só pela porta ServicoDeAnalise. Dentro do núcleo, casos de uso usam o domínio elétrico, que usa o grafo genérico. Os dados chegam pela porta FonteDeRede, implementada pelo leitor de CSV, que lê data/bh/*.csv gerados pelo prep_osm.</desc>
