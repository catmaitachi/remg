<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="classes-claro-title classes-claro-desc" id="classes-root">
<title id="classes-claro-title">Classes do núcleo do Cintilante</title><desc id="classes-claro-desc">Pacote grafo: Grafo e os algoritmos Dinic, Tarjan, Dijkstra e BFS, que dependem de Grafo. Pacote domínio: RedeEletrica compõe subestações, pontos, trechos e linhas AT; Chave herda de Trecho; RedeEletrica monta o Grafo e guarda a tabela de ids. Nota: um Dinic novo por pedido.</desc>
