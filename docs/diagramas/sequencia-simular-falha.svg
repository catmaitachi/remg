<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequencia-simular-falha-claro-title sequencia-simular-falha-claro-desc" id="sequencia-simular-falha-root">
<title id="sequencia-simular-falha-claro-title">Sequência: simular falha</title><desc id="sequencia-simular-falha-claro-desc">O operador derruba um item pelo botão do cartão dele. O front faz POST /analise ao servidor Python, que executa SimularFalha pela porta ServicoDeAnalise. SimularFalha traduz ids e marca falhas na RedeEletrica, roda o Alcance (BFS a partir da super-fonte S) para achar pontos sem energia e Dinic para o novo fluxo, e o resultado volta como JSON até o front, que mostra a área sem luz.</desc>
