<title id="estados-trecho-claro-title">Estados de um trecho e de uma chave</title><desc id="estados-trecho-claro-desc">Trecho: começa Normal; o operador derruba e ele vai para EmFalha; o operador restaura e ele volta a Normal. Chave, estado composto: começa Aberta; a rota alternativa fecha; quando a falha é resolvida, volta a Aberta.</desc>
